<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BillerQ AI Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }
    header { background: #161b22; border-bottom: 1px solid #30363d; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
    .logo { width: 38px; height: 38px; background: #1d9e75; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; }
    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 12px; color: #7d8590; margin-top: 2px; }
    .status { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: #1d9e75; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #1d9e75; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    .msg { display: flex; flex-direction: column; max-width: 90%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }
    .msg-label { font-size: 11px; color: #7d8590; margin-bottom: 5px; font-family: monospace; }
    .bubble { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.55; }
    .msg.user .bubble { background: #1d9e75; color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: #161b22; border: 1px solid #30363d; color: #e6edf3; border-bottom-left-radius: 4px; }
    .section-label { font-size: 10px; color: #7d8590; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
    .sql-block { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px 14px; font-family: Consolas,monospace; font-size: 12px; color: #58a6ff; white-space: pre-wrap; word-break: break-all; margin-bottom: 12px; }
    .summary-box { background: #1a2a1e; border: 1px solid #1d9e75; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #adbac7; margin-bottom: 10px; line-height: 1.6; }
    .insights-box { background: #1a1f2e; border: 1px solid #388bfd; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
    .insights-box .ins-title { font-size: 11px; color: #58a6ff; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 7px; }
    .insight-item { font-size: 13px; color: #adbac7; margin-bottom: 5px; line-height: 1.5; padding-left: 4px; }
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead tr { background: #1d2a22; }
    th { padding: 8px 12px; text-align: left; color: #3fb950; font-weight: 600; white-space: nowrap; border-bottom: 1px solid #30363d; }
    tbody tr { border-top: 1px solid #21262d; }
    tbody tr:hover { background: #1c2128; }
    td { padding: 7px 12px; color: #c9d1d9; white-space: nowrap; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .b-active,.b-paid { background:#1a3d2b; color:#3fb950; }
    .b-pending { background:#3d2b0f; color:#d29922; }
    .b-overdue,.b-failed { background:#3d1515; color:#f85149; }
    .b-premium { background:#2d1a3d; color:#a371f7; }
    .b-standard { background:#0d2044; color:#58a6ff; }
    .row-count { font-size: 11px; color: #7d8590; font-family: monospace; }
    .typing { display: flex; align-items: center; gap: 5px; padding: 11px 16px; background: #161b22; border: 1px solid #30363d; border-radius: 14px; border-bottom-left-radius: 4px; width: fit-content; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #1d9e75; animation: blink 1.2s infinite; }
    .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
    @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
    .error-box { background: #3d1515; border: 1px solid #f85149; color: #f85149; border-radius: 8px; padding: 10px 14px; font-size: 13px; }
    .chips { padding: 10px 24px 4px; display: flex; gap: 8px; flex-wrap: wrap; background: #0d1117; border-top: 1px solid #21262d; }
    .chip { background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 5px 14px; font-size: 12.5px; color: #8b949e; cursor: pointer; transition: all .15s; }
    .chip:hover { background: #1d2a22; color: #3fb950; border-color: #1d9e75; }
    .input-bar { padding: 14px 24px 18px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; align-items: center; }
    #inp { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 10px 16px; font-size: 14px; color: #e6edf3; outline: none; font-family: inherit; }
    #inp:focus { border-color: #1d9e75; }
    #inp::placeholder { color: #484f58; }
    #send-btn { background: #1d9e75; color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-size: 14px; font-family: inherit; cursor: pointer; }
    #send-btn:hover { background: #17856a; }
    #send-btn:disabled { background: #21262d; color: #7d8590; cursor: not-allowed; }
  </style>
</head>
<body>
<header>
  <div class="logo">BQ</div>
  <div><h1>BillerQ AI Assistant</h1><p>Qwen 2.5 7B · Ollama · MySQL · FastAPI</p></div>
  <div class="status"><div class="dot"></div> Live</div>
</header>
<div id="chat"></div>
<div class="chips">
  <div class="chip" onclick="sendChip(this)">Show all customers</div>
  <div class="chip" onclick="sendChip(this)">Recent payments</div>
  <div class="chip" onclick="sendChip(this)">Latest invoices</div>
  <div class="chip" onclick="sendChip(this)">Active subscriptions</div>
  <div class="chip" onclick="sendChip(this)">Overdue invoices</div>
  <div class="chip" onclick="sendChip(this)">Top 5 orders by amount</div>
</div>
<div class="input-bar">
  <input id="inp" placeholder="Ask anything about your business data…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"/>
  <button id="send-btn" onclick="send()">&#9658; Send</button>
</div>
<script>
  const chat=document.getElementById('chat'),inp=document.getElementById('inp'),btn=document.getElementById('send-btn');
  const SW=['active','inactive','paid','pending','overdue','failed','cancelled','completed','premium','standard'];
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function badge(v){const s=String(v).toLowerCase();if(['active','paid','completed'].includes(s))return'b-active';if(['pending','inactive'].includes(s))return'b-pending';if(['overdue','failed','cancelled'].includes(s))return'b-overdue';if(s==='premium')return'b-premium';if(s==='standard')return'b-standard';return'';}
  function cell(v){const s=String(v);if(SW.includes(s.toLowerCase())){const c=badge(s);return c?`<span class="badge ${c}">${esc(s)}</span>`:esc(s);}return esc(s);}
  function tbl(cols,rows){let h='<div class="table-wrap"><table><thead><tr>';cols.forEach(c=>h+=`<th>${esc(c)}</th>`);h+='</tr></thead><tbody>';rows.forEach(r=>{h+='<tr>';r.forEach(v=>h+=`<td>${cell(v)}</td>`);h+='</tr>';});return h+'</tbody></table></div>';}
  function ins(list){if(!list||!list.length)return'';let h='<div class="insights-box"><div class="ins-title">&#128200; Smart Insights</div>';list.forEach(i=>h+=`<div class="insight-item">&#128161; ${esc(i)}</div>`);return h+'</div>';}
  function userMsg(t){const e=document.createElement('div');e.className='msg user';e.innerHTML=`<div class="msg-label">you</div><div class="bubble">${esc(t)}</div>`;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;}
  function typing(){const e=document.createElement('div');e.className='msg bot';e.id='typ';e.innerHTML='<div class="msg-label">billerq ai</div><div class="typing"><span></span><span></span><span></span></div>';chat.appendChild(e);chat.scrollTop=chat.scrollHeight;}
  function rmTyping(){document.getElementById('typ')?.remove();}
  function botMsg(d){
    const e=document.createElement('div');e.className='msg bot';
    if(!d.success){e.innerHTML=`<div class="msg-label">billerq ai</div><div class="bubble"><div class="error-box">&#9888; ${esc(d.error)}</div></div>`;}
    else{const t=d.rows&&d.rows.length?tbl(d.columns,d.rows):'<p style="color:#7d8590;margin-top:8px;">No records found.</p>';
    e.innerHTML=`<div class="msg-label">billerq ai</div><div class="bubble">${d.summary?`<div class="section-label">Summary</div><div class="summary-box">&#128203; ${esc(d.summary)}</div>`:''}<div class="section-label">Generated SQL</div><div class="sql-block">${esc(d.sql)}</div><div class="section-label">Results</div>${t}<div class="row-count" style="margin-bottom:10px;">${d.row_count} row(s) returned</div>${ins(d.insights)}${d.explanation?`<div style="font-size:12px;color:#7d8590;margin-top:6px;">&#128196; ${esc(d.explanation)}</div>`:''}</div>`;}
    chat.appendChild(e);chat.scrollTop=chat.scrollHeight;
  }
  async function send(){
    const msg=inp.value.trim();if(!msg)return;
    inp.value='';btn.disabled=true;userMsg(msg);typing();
    try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const d=await r.json();rmTyping();botMsg(d);}
    catch(e){rmTyping();botMsg({success:false,error:'Network error — is the server running?'});}
    finally{btn.disabled=false;inp.focus();}
  }
  function sendChip(el){inp.value=el.textContent;send();}
  window.addEventListener('load',()=>{const e=document.createElement('div');e.className='msg bot';e.innerHTML='<div class="msg-label">billerq ai</div><div class="bubble">&#128075; Hello! I\'m the <strong>BillerQ AI Assistant</strong> powered by <strong>Qwen 2.5 7B</strong>.<br><br>Ask me anything about your business data in plain English. I\'ll generate the SQL, run it on MySQL, and explain the results.</div>';chat.appendChild(e);});
</script>
</body>
</html>
