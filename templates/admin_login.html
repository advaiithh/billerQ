<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillerQ — Admin Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 32px;
    }
    .logo { width: 48px; height: 48px; background: #1d9e75; border-radius: 12px; display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;margin-bottom:16px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #7d8590; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
    input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #e6edf3; margin-bottom: 16px; font-family: inherit; }
    input:focus { outline: none; border-color: #1d9e75; }
    button { width: 100%; background: #1d9e75; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .alert { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .alert-error { background: #3d1515; border: 1px solid #f85149; color: #f85149; }
    .foot { text-align: center; margin-top: 20px; font-size: 13px; color: #7d8590; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">BQ</div>
    <h1>Admin sign in</h1>
    <p class="sub">Sign in as administrator (no company required)</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin-login">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" required autocomplete="email" placeholder="admin@company.com">

      <label for="password">Password</label>
      <input type="password" name="password" id="password" required autocomplete="current-password" placeholder="••••••••">

      <button type="submit">Sign in</button>
    </form>

    <p class="foot"><a href="/login">Back to user login</a></p>
  </div>
</body>
</html>
