  .bq-help-link { font-size: 12px; color: #58a6ff; text-decoration: none; margin-left: 10px; }

  .bq-table td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

</style>

<!-- Chatbot button: hidden until auth confirmed, so it won't show on login/signup -->
<div id="bq-chatbot-btn" onclick="bqToggleChat()" title="BillerQ Copilot">
  <img src="/Services/logoBillerq.png" alt="BillerQ Copilot">
</div>

<div id="bq-chatbot-box">
  <div class="bq-header">
    <div class="bq-title-wrap">
      <div class="bq-dot"></div>
      <div>
        <div class="bq-title">BillerQ Business Copilot</div>
        <div class="bq-user-info" id="bq-user-label">Connecting…</div>
      </div>
      <a href="/guide" target="_blank" class="bq-help-link">Guide</a>
    </div>
    <button class="bq-close-btn" onclick="bqToggleChat()">&times;</button>
  </div>
  <div class="bq-body" id="bq-chat-body"></div>
  <div class="bq-chips">
    <div class="bq-chip" onclick="bqSendText('Show dashboard summary')">Dashboard summary</div>
    <div class="bq-chip" onclick="bqSendText('Who has pending payments?')">Pending payments</div>
    <div class="bq-chip" onclick="bqSendText('Show active broadband subscribers')">Broadband</div>
    <div class="bq-chip" onclick="bqSendText('Show all customers')">All customers</div>
    <div class="bq-chip" onclick="bqSendText('Inactive customers')">Inactive customers</div>
    <div class="bq-chip" onclick="bqSendText('Recent payments')">Recent payments</div>
  </div>
  <div class="bq-footer">
    <input type="text" id="bq-chat-input" class="bq-input"
      placeholder="Ask BillerQ Copilot..."
      onkeydown="if(event.key==='Enter')bqSend()">
    <button id="bq-send-btn" class="bq-send" onclick="bqSend()">Send</button>
  </div>
</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  var bqCurrentUser = null;
  var bqDashboardData = {};
  var bqApiHost = '';   // same-origin FastAPI server

  // ── Path check: hide chatbot on auth pages, show on all dashboard pages ──
  // The React build serves the SAME index.html for ALL routes.
  // We block on KNOWN auth-only pages; everything else is a dashboard page.
  // (Block-list is safer than allow-list because the dashboard has many routes.)
  function bqIsAppPage() {
    var p = window.location.pathname.toLowerCase();
    var authPages = [
      '/',
      '/signin',       // React router login page
      '/signup',
      '/login',
      '/register',
      '/forget-pwd',
      '/forgotpassword',
      '/emailotp',
      '/emailotpsuccess',
      '/error',
    ];
    // Also block if it ends with /signin or /signup (catch sub-path variants)
    if (authPages.indexOf(p) !== -1) return false;
    if (/\/signin$|\/signup$|\/login$/.test(p)) return false;
    return true; // any other path is a dashboard page
  }

  // ── Show / hide widget based on BOTH auth AND current page ──────────────────
  function bqApplyVisibility() {
    var btn = document.getElementById('bq-chatbot-btn');
    var box = document.getElementById('bq-chatbot-box');
    if (!btn) return;
    var shouldShow = bqCurrentUser && bqIsAppPage();
    btn.style.display = shouldShow ? 'flex' : 'none';
    // If the widget was open but we navigated away, close it
    if (!shouldShow && box) box.classList.remove('open');
  }

  // ── Auth check ───────────────────────────────────────────────────────────────
  // Calls /auth/me to confirm a valid session exists.
  // Does NOT reveal the button by itself — bqApplyVisibility() decides that.
  async function bqInitAuth() {
    try {
      var r = await fetch(bqApiHost + '/auth/me', { credentials: 'include' });
      if (!r.ok) { bqCurrentUser = null; bqApplyVisibility(); return; }
      var d = await r.json();
      if (!d.success || !d.user) { bqCurrentUser = null; bqApplyVisibility(); return; }
      bqCurrentUser = d.user;

      // Update header label
      var lbl = document.getElementById('bq-user-label');
      if (lbl) {
        lbl.textContent = bqCurrentUser.role === 'admin'
          ? (bqCurrentUser.company_name || 'All companies')
          : (bqCurrentUser.company_name || bqCurrentUser.email);
      }

      bqApplyVisibility();          // show button only if path is /app
      if (bqIsAppPage()) bqLoadDashboardData(); // pre-fetch KPIs only on dashboard
    } catch(e) { bqCurrentUser = null; bqApplyVisibility(); }
  }

  // ── Dashboard API loader ─────────────────────────────────────────────────
  // Fetches the same endpoints the React dashboard uses so the chatbot can
  // answer KPI questions without an AI round-trip.
  async function bqLoadDashboardData() {
    var endpoints = {
      invoice:        '/get-invoice-amount',
      connections:    '/get-connection-data',
      customerStatus: '/get-customer-status-wise-count',
      recentPayments: '/get-recent-payment',
      recentOrders:   '/get-recent-order',
      stbStatus:      '/stb-status-count',
    };
    var results = {};
    await Promise.allSettled(Object.entries(endpoints).map(async function(kv) {
      var key = kv[0], path = kv[1];
      try {
        var r = await fetch(bqApiHost + path, { credentials: 'include' });
        if (r.ok) results[key] = await r.json();
      } catch(e) {}
    }));
    bqDashboardData = results;
  }

  // ── Dashboard intent matcher ─────────────────────────────────────────────
  // Returns HTML string if the query can be answered from dashboard data,
  // otherwise returns null (falls through to /chat AI endpoint).
  function bqCheckDashboardIntent(text) {
    var q = text.toLowerCase();
    var d = bqDashboardData;

    // Invoice / Collection
    if (/invoice|collection|amount|due|revenue|billing/.test(q)) {
      var inv = d.invoice;
      if (inv && inv.success) {
        return bqStatGrid('&#x1F4B0; Invoice &amp; Collection Summary', [
          { label: 'Total Invoice',  value: '\u20b9' + bqFmt(inv.invoice) },
          { label: 'Amount Due',     value: '\u20b9' + bqFmt(inv.due) },
          { label: 'Collection',     value: '\u20b9' + bqFmt(inv.collection) },
          { label: 'Growth %',       value: (inv.percentage || 0) + '%' },
        ]);
      }
    }

    // Connections / Cable / Broadband / IPTV
    if (/connection|cable|broadband|iptv/.test(q) && !/show all|list|display/.test(q)) {
      var conn = d.connections;
      if (conn && conn.success) {
        return bqStatGrid('&#x1F4E1; Connection Summary', [
          { label: 'Cable',      value: conn.cable ?? 0 },
          { label: 'Broadband',  value: conn.broadband ?? 0 },
          { label: 'IPTV',       value: conn.iptv ?? 0 },
        ]);
      }
    }

    // Customer counts (quick stat, not a list)
    if (/how many customer|customer count|customer status/.test(q) && !/show|list/.test(q)) {
      var cs = d.customerStatus;
      if (cs && cs.success) {
        return bqStatGrid('&#x1F465; Customer Status', [
          { label: 'Active',   value: cs.active  ?? 0, sub: 'customers' },
          { label: 'Inactive', value: cs.inactive ?? 0, sub: 'customers' },
          { label: 'Total',    value: cs.total   ?? 0, sub: 'customers' },
        ]);
      }
    }

    // STB
    if (/stb|set.top.box/.test(q)) {
      var stb = d.stbStatus;
      if (stb && stb.success) {
        return bqStatGrid('&#x1F4FA; STB Status', [
          { label: 'Active STBs',   value: stb.active   ?? 0 },
          { label: 'Inactive STBs', value: stb.inactive ?? 0 },
        ]);
      }
    }

    // Recent payments (table)
    if (/recent payment|latest payment/.test(q)) {
      var rp = d.recentPayments;
      if (rp && rp.success && rp.data && rp.data.data) {
        return bqMiniTable('&#x1F4B3; Recent Payments',
          ['Name','Amount','Date'],
          rp.data.data.map(function(p){ return [p.name, '\u20b9'+bqFmt(p.amount), p.payment_date]; }),
          rp.data.data.length + ' recent payment(s)'
        );
      }
    }

    // Recent orders (table)
    if (/recent order|latest order/.test(q)) {
      var ro = d.recentOrders;
      if (ro && ro.success && ro.data && ro.data.data) {
        return bqMiniTable('&#x1F4E6; Recent Orders',
          ['Product','Price','Status'],
          ro.data.data.map(function(o){ return [o.product, o.price, o.prdouctstatus]; }),
          ro.data.data.length + ' recent order(s)'
        );
      }
    }

    // Full dashboard summary
    if (/dashboard|summary|overview|snapshot/.test(q)) {
      return bqFullSummary();
    }

    return null; // let /chat AI handle it
  }

  // ── HTML builder helpers ─────────────────────────────────────────────────
  function bqFmt(n) {
    return Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
  }
  function bqStatGrid(title, stats) {
    var cards = stats.map(function(s){
      return '<div class="bq-stat-card">'
        + '<div class="bq-stat-label">' + s.label + '</div>'
        + '<div class="bq-stat-value">' + s.value + '</div>'
        + (s.sub ? '<div class="bq-stat-sub">' + s.sub + '</div>' : '')
        + '</div>';
    }).join('');
    return '<strong>' + title + '</strong><div class="bq-stat-grid">' + cards + '</div>'
      + '<div style="font-size:11px;color:#7d8590;margin-top:8px;">&#128202; Live data from your BillerQ dashboard APIs</div>';
  }
  function bqMiniTable(title, cols, rows, note) {
    var th = cols.map(function(c){ return '<th>' + c + '</th>'; }).join('');
    var tb = rows.map(function(r){
      return '<tr>' + r.map(function(v){ return '<td>' + (v||'') + '</td>'; }).join('') + '</tr>';
    }).join('');
    return '<strong>' + title + '</strong>'
      + '<div class="bq-table-wrap"><table class="bq-table"><thead><tr>' + th + '</tr></thead><tbody>' + tb + '</tbody></table></div>'
      + (note ? '<div style="font-size:11px;color:#7d8590;margin-top:6px;">&#128202; ' + note + '</div>' : '');
  }
  function bqFullSummary() {
    var d = bqDashboardData;
    var html = '<strong>&#128202; Dashboard Snapshot</strong><div class="bq-stat-grid">';
    var inv = d.invoice;
    if (inv && inv.success) {
      html += '<div class="bq-stat-card"><div class="bq-stat-label">Total Invoice</div><div class="bq-stat-value">\u20b9' + bqFmt(inv.invoice) + '</div></div>';
      html += '<div class="bq-stat-card"><div class="bq-stat-label">Collection</div><div class="bq-stat-value">\u20b9' + bqFmt(inv.collection) + '</div></div>';
    }
    var cs = d.customerStatus;
    if (cs && cs.success) {
      html += '<div class="bq-stat-card"><div class="bq-stat-label">Active Customers</div><div class="bq-stat-value">' + (cs.active??0) + '</div></div>';
      html += '<div class="bq-stat-card"><div class="bq-stat-label">Total Customers</div><div class="bq-stat-value">' + (cs.total??0) + '</div></div>';
    }
    var conn = d.connections;
    if (conn && conn.success) {
      html += '<div class="bq-stat-card"><div class="bq-stat-label">Cable</div><div class="bq-stat-value">' + (conn.cable??0) + '</div></div>';
      html += '<div class="bq-stat-card"><div class="bq-stat-label">Broadband</div><div class="bq-stat-value">' + (conn.broadband??0) + '</div></div>';
    }
    var stb = d.stbStatus;
    if (stb && stb.success) {
      html += '<div class="bq-stat-card"><div class="bq-stat-label">Active STBs</div><div class="bq-stat-value">' + (stb.active??0) + '</div></div>';
    }
    html += '</div><div style="font-size:11px;color:#7d8590;margin-top:8px;">&#128205; Live data from your BillerQ dashboard APIs. Ask me anything!</div>';
    return html;
  }

  // ── Toggle ───────────────────────────────────────────────────────────────
  function bqToggleChat() {
    var box = document.getElementById('bq-chatbot-box');
    var opening = !box.classList.contains('open');
    box.classList.toggle('open');
    if (opening) {
      var body = document.getElementById('bq-chat-body');
      if (body.children.length === 0) {
        var company = bqCurrentUser
          ? (bqCurrentUser.role === 'admin' ? 'all companies' : (bqCurrentUser.company_name || 'your company'))
          : 'your company';
        var name = bqCurrentUser ? (' ' + bqCurrentUser.email.split('@')[0]) : '';
        bqAddRaw(
          '\uD83D\uDC4B Hi' + name + '! I\'m your <strong>BillerQ Copilot</strong>.<br><br>'
          + 'I have live access to <strong>' + company + '</strong>\'s billing data '
          + '&mdash; customers, invoices, payments, subscriptions, and your dashboard KPIs.<br><br>'
          + 'Ask me anything or tap a quick button below!',
          false
        );
      }
      bqLoadDashboardData(); // refresh each open
      setTimeout(function(){ var el=document.getElementById('bq-chat-input'); if(el) el.focus(); }, 150);
    }
  }

  // ── Message renderers ────────────────────────────────────────────────────
  function bqEsc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function bqAddRaw(html, isUser) {
    var body = document.getElementById('bq-chat-body');
    var msg = document.createElement('div');
    msg.className = 'bq-msg ' + (isUser ? 'user' : 'bot');
    msg.innerHTML = '<div class="bq-bubble">' + html + '</div>';
    body.appendChild(msg);
    body.scrollTop = body.scrollHeight;
  }
  function bqAddMsg(text, isUser, data) {
    var body = document.getElementById('bq-chat-body');
    var msg = document.createElement('div');
    msg.className = 'bq-msg ' + (isUser ? 'user' : 'bot');
    var html = '<div class="bq-bubble">'
      + bqEsc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')
      + '</div>';
    if (data && data.rows && data.rows.length) {
      var th = (data.columns||[]).slice(0,4).map(function(c){ return '<th>'+bqEsc(c)+'</th>'; }).join('');
      var tb = data.rows.slice(0,5).map(function(row){
        return '<tr>'+(row||[]).slice(0,4).map(function(v){ return '<td>'+bqEsc(v)+'</td>'; }).join('')+'</tr>';
      }).join('');
      html += '<div class="bq-table-wrap"><table class="bq-table"><thead><tr>'+th+'</tr></thead><tbody>'+tb+'</tbody></table></div>';
      if (data.row_count > 5) {
        html += '<div style="font-size:10px;color:#7d8590;margin-top:4px;">\u2026and ' + (data.row_count-5) + ' more rows. Open the full report for details.</div>';
      }
    }
    msg.innerHTML = html;
    body.appendChild(msg);
    body.scrollTop = body.scrollHeight;
  }
  function bqShowTyping() {
    var body = document.getElementById('bq-chat-body');
    var t = document.createElement('div');
    t.className = 'bq-msg bot'; t.id = 'bq-typing-indicator';
    t.innerHTML = '<div class="bq-bubble"><div class="bq-typing"><span></span><span></span><span></span></div></div>';
    body.appendChild(t); body.scrollTop = body.scrollHeight;
  }
  function bqHideTyping() { var el=document.getElementById('bq-typing-indicator'); if(el) el.remove(); }

  // ── Send ─────────────────────────────────────────────────────────────────
  async function bqSendText(text) {
    if (!text || !bqCurrentUser) return;
    bqAddMsg(text, true);

    // 1. Try dashboard data first
    var dash = bqCheckDashboardIntent(text);
    if (dash !== null) {
      bqShowTyping();
      await new Promise(function(r){ setTimeout(r, 380); });
      bqHideTyping();
      bqAddRaw(dash, false);
      return;
    }

    // 2. Forward to AI /chat endpoint
    bqShowTyping();
    var btn = document.getElementById('bq-send-btn');
    if (btn) btn.disabled = true;
    try {
      var r = await fetch(bqApiHost + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
        credentials: 'include'
      });
      var d = await r.json();
      bqHideTyping();
      if (!d.success) {
        if (d.error && /log in/i.test(d.error)) {
          // Session expired — hide widget
          bqCurrentUser = null;
          var b=document.getElementById('bq-chatbot-btn'); if(b) b.style.display='none';
          document.getElementById('bq-chatbot-box').classList.remove('open');
        }
        bqAddMsg('\u26A0\uFE0F ' + (d.error || 'Something went wrong.'), false);
        return;
      }
      var reply = d.blocked
        ? (d.narrative || d.summary || 'This type of request is not supported.')
        : (d.narrative || d.summary || 'No details available.');
      bqAddMsg(reply, false, d.blocked ? null : d);
    } catch(e) {
      bqHideTyping();
      bqAddMsg('Network error \u2014 cannot reach the BillerQ server.', false);
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function bqSend() {
    var input = document.getElementById('bq-chat-input');
    var text = (input.value||'').trim();
    if (!text) return;
    input.value = '';
    bqSendText(text);
  }

  // ── Boot: watch for React client-side route changes ─────────────────────────
  // React (and most SPAs) change the URL via history.pushState without a full
  // page reload.  We patch pushState so we can react to navigation events.
  (function() {
    var _push = history.pushState.bind(history);
    history.pushState = function() {
      _push.apply(history, arguments);
      window.dispatchEvent(new Event('bq-route-change'));
    };
  })();

  // Re-evaluate visibility whenever the URL changes (back/forward or pushState)
  window.addEventListener('popstate', function() {
    bqApplyVisibility();
    if (bqCurrentUser && bqIsAppPage()) bqLoadDashboardData();
  });
  window.addEventListener('bq-route-change', function() {
    bqApplyVisibility();
    if (bqCurrentUser && bqIsAppPage()) bqLoadDashboardData();
  });

  // Initial auth check on page load
  window.addEventListener('load', bqInitAuth);
</script>
</body></html>
